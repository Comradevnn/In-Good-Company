<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Gabarito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1280; --ink-2:#3B43A6; --ink-3:#5058B0;
  --pink:#FF4F9A; --pink-tint:#FFE3EF;
  --blue:#2E3BF0; --yellow:#FFE23D; --yellow-tint:#FFF6BF;
  --green:#0A7A48; --violet:#7B2CD6;
  --tint:#EEF0FF; --edge:#6E76D0; --paper:#FFFFFF;
  --danger:#B3001B; --danger-tint:#FFE9EC;
  --off-bg:#E4E6F7; --off-fg:#5C62A8; --on-ink-2:#D9DBFF;
  --font-display:'Gabarito','Trebuchet MS',sans-serif;
  --font-text:'Figtree','Helvetica Neue',Arial,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-field:20px; --r-card:28px; --r-hero:32px; --r-pill:999px;
  --shadow-bar:0 -4px 16px rgba(0,0,0,.10);
  --t-display:56px; --t-headline:36px; --t-title:24px; --t-subtitle:18px;
  --t-body:16px; --t-body-s:15px; --t-label:15px; --t-caption:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E9E9EE}
body{font-family:var(--font-text);color:#1B1B26;background:#E9E9EE;padding:48px 32px 72px;-webkit-font-smoothing:antialiased}
.page-head{max-width:1100px;margin:0 auto 40px}
.page-head h1{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:44px;letter-spacing:-.01em;color:#1B1B26}
.page-head p{font-weight:500;font-size:17px;line-height:26px;margin-top:8px;max-width:680px;color:#3A3A48}
.row-title{max-width:2200px;margin:0 auto 20px;font-family:var(--font-display);font-weight:800;font-size:20px;color:#1B1B26}
.frames{display:flex;flex-wrap:wrap;gap:40px 36px;justify-content:center;align-items:flex-start;margin:0 auto 56px}
figure{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font-size:15px;line-height:20px;font-weight:600;color:#3A3A48}

/* device */
.device{position:relative;width:390px;height:844px;box-sizing:content-box;border:10px solid #14152B;border-radius:56px;overflow:hidden;background:#fff}
.device.tall{height:auto}
.screen{position:relative;width:390px;height:844px;overflow:hidden;background:var(--paper);font-family:var(--font-text);color:var(--ink)}
.tall .screen{height:auto;min-height:844px;overflow:visible;padding-bottom:34px}
.island{position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:17px;background:#14152B;z-index:20}
.home-ind{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:20}

/* status bar */
.statusbar{height:47px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 40px;font-weight:700;font-size:17px;color:var(--ink)}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.top{position:relative;z-index:5}
.top.pinned{position:absolute;top:0;left:0;right:0}
.top.pink{background:var(--pink)}
.top.white{background:#fff}
.bar{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px 0 12px}
.bar-title{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:26px;color:var(--ink)}
.back{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}

/* icons */
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* type roles */
.t-display{font-family:var(--font-display);font-weight:900;font-size:var(--t-display);line-height:54px;letter-spacing:-.02em}
.t-headline{font-family:var(--font-display);font-weight:900;font-size:var(--t-headline);line-height:40px;letter-spacing:-.015em}
.t-title{font-family:var(--font-display);font-weight:800;font-size:var(--t-title);line-height:28px;letter-spacing:-.005em}
.t-subtitle{font-family:var(--font-display);font-weight:700;font-size:var(--t-subtitle);line-height:24px}
.t-body{font-size:var(--t-body);line-height:24px;font-weight:500}
.t-body-s{font-size:var(--t-body-s);line-height:22px;font-weight:500}
.t-label{font-size:var(--t-label);line-height:20px;font-weight:700}
.t-caption{font-size:var(--t-caption);line-height:18px;font-weight:700}
.muted{color:var(--ink-2)}

/* layout */
.pad{padding:0 24px}
.stack>*+*{margin-top:var(--s4)}

/* chips and tags */
.tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--r-pill);font-weight:700;font-size:15px;line-height:20px;color:var(--ink);background:#fff;white-space:nowrap}
.tag.yellow{background:var(--yellow)}
.tag.ink{background:var(--ink);color:#fff}
.tag.line{background:#fff;border:2px solid var(--ink);height:32px;padding:0 12px}
.tag.pink{background:var(--pink)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 11px;border-radius:var(--r-pill);border:2px solid var(--edge);background:#fff;color:var(--ink);font-weight:700;font-size:15px;white-space:nowrap}
.chip.sel{background:var(--pink);border-color:var(--ink)}
.chips{display:flex;gap:6px}

/* fields */
.field{display:flex;flex-direction:column;gap:8px}
.field>label{font-weight:700;font-size:15px;line-height:20px;color:var(--ink)}
.input{height:56px;border-radius:var(--r-field);border:2px solid var(--edge);background:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap}
.input .ph{color:var(--ink-3);font-weight:500}
.input.focus{border-color:var(--ink);box-shadow:0 0 0 4px var(--pink)}
.input.err{border-color:var(--danger);background:var(--danger-tint);color:var(--ink)}
.input.err .ic{color:var(--danger)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ink);display:block}
.pair{display:flex;gap:12px}
.pair>*{min-width:0}
.errmsg{display:flex;gap:8px;align-items:flex-start;color:var(--danger);font-weight:700;font-size:15px;line-height:22px}
.helper{font-size:15px;line-height:22px;font-weight:500;color:var(--ink-2)}

/* links and buttons */
.link{display:flex;align-items:center;min-height:48px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.link.center{justify-content:center}
.link.right{justify-content:flex-end;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;width:100%;border-radius:var(--r-pill);font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.005em}
.btn.primary{background:var(--ink);color:#fff}
.btn.secondary{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.disabled{background:var(--off-bg);color:var(--off-fg)}
.footer{position:absolute;left:0;right:0;bottom:0;padding:16px 24px 34px;background:#fff;box-shadow:var(--shadow-bar);z-index:10}
.tall .footer{position:static;box-shadow:none;padding-bottom:16px}
.footer .link{margin-bottom:-8px}

/* cards */
.card{border-radius:var(--r-card);background:var(--tint);padding:20px}
.card.yellow{background:var(--yellow-tint)}
.card.pinkt{background:var(--pink-tint)}
.card.ink{background:var(--ink);color:#fff}
.section-h{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.hero-pink{background:var(--pink);border-radius:0 0 var(--r-hero) var(--r-hero);position:relative}

/* notice */
.notice{display:flex;gap:12px;border-radius:24px;background:var(--yellow-tint);padding:16px;color:var(--ink)}
.notice .ico{width:36px;height:36px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;flex:none}
.notice p{font-size:15px;line-height:22px;font-weight:500}

/* upload card */
.upload{display:flex;gap:14px;align-items:center;border-radius:var(--r-card);border:2px dashed var(--green);background:#E6F7EE;padding:16px}
.upload .ico{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}

/* toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px;font-weight:700;font-size:17px}
.switch{position:relative;width:56px;height:32px;border-radius:16px;border:2px solid var(--ink);background:#fff;flex:none}
.switch::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--ink)}
.switch.on{background:var(--pink)}
.switch.on::after{left:28px;width:20px;height:20px;top:4px}

/* lists */
.navrow{display:flex;align-items:center;gap:14px;min-height:64px;border-radius:24px;background:var(--tint);padding:0 16px;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink)}
.navrow .ni{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.navrow .chev{margin-left:auto;display:flex}
.kv{display:flex;gap:14px;align-items:flex-start}
.kv .ki{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.kv .kl{font-weight:700;font-size:14px;line-height:18px;color:var(--ink-2)}
.kv .kv-v{font-size:16px;line-height:22px;font-weight:600;color:var(--ink)}
.bul{display:flex;gap:12px;font-size:15px;line-height:22px;font-weight:500}
.bul::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none;margin-top:7px}
.scrollbar{position:absolute;right:4px;width:4px;border-radius:2px;background:#8C92DD;z-index:12}
.stats{display:flex;border-radius:var(--r-card);background:var(--tint);padding:20px 8px}
.stats>div{flex:1;text-align:center}
.stats b{display:block;font-family:var(--font-display);font-weight:900;font-size:56px;line-height:56px;letter-spacing:-.02em;color:var(--ink)}
.stats span{display:block;margin-top:4px;font-size:15px;line-height:20px;font-weight:700;color:var(--ink-2)}
.disc-pair{position:relative;flex:none}
</style></head><body>
