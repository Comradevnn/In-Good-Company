<style>
:root{
  /* palette: carbonless form stocks + carbon ink + stamp */
  --ink:#261A5E; --ink-2:#453C7C; --ink-3:#5A5486;
  --canary:#F6E381; --canary-deep:#E9D262;
  --pink:#F2B9AE; --pink-deep:#E7A89C;
  --paper:#F8F8FB; --white:#FFFFFF;
  --stamp:#A32109;
  --dis:#E3DDE6; --rule-soft:#CFCAE0;
  /* type */
  --f-serif:'Besley',Georgia,'Times New Roman',serif;
  --f-cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --t-display:34px; --t-h2:28px; --t-title:22px; --t-head:18px; --t-body:16px; --t-small:15px; --t-fine:14px; --t-label:16px; --t-button:20px; --t-figure:32px;
  /* space (4pt) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --margin:20px;
  /* shape */
  --r:2px; --line:1.5px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E4E4E7;color:#26262B;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:40px 24px 64px}
.page-head{max-width:1500px;margin:0 auto 36px}
.page-head h1{font:700 30px/36px var(--f-serif);color:#1d1d22}
.page-head p{font:400 16px/24px system-ui,sans-serif;color:#4a4a52;margin-top:6px;max-width:70ch}
.rack{display:flex;flex-wrap:wrap;gap:48px 40px;justify-content:center;align-items:flex-start;max-width:1700px;margin:0 auto}
.unit{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font:600 15px/20px system-ui,sans-serif;color:#3a3a42;text-align:center;max-width:390px}
.phone{background:#17132E;padding:11px;border-radius:56px;width:412px}
.screen{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--ink);font-family:var(--f-serif);font-size:var(--t-body);line-height:24px;background:var(--paper)}
.screen.auto{height:auto}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}

/* ground fields */
.g-canary{background:var(--canary)} .g-pink{background:var(--pink)} .g-paper{background:var(--paper)}

/* status bar + safe areas */
.status{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 7px 34px;position:relative;font:600 16px/20px system-ui,-apple-system,sans-serif;color:var(--ink)}
.island{position:absolute;left:50%;top:11px;width:118px;height:33px;margin-left:-59px;background:#0c0a1a;border-radius:17px}
.sys{display:flex;align-items:center;gap:6px}
.safe{height:34px;flex:none;position:relative}
.safe::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;background:var(--ink);border-radius:3px}

/* top bar */
.bar{height:56px;flex:none;display:flex;align-items:center;gap:var(--s3);padding:0 var(--margin)}
.bar.plain{padding-left:var(--margin)}
.bar .title{font:600 var(--t-head)/24px var(--f-cond);letter-spacing:.02em}
.wordmark{font:700 21px/26px var(--f-serif);letter-spacing:-.005em}
.iconbtn{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--white);border:var(--line) solid var(--ink);border-radius:var(--r);color:var(--ink);position:relative}
.unread{position:absolute;right:7px;top:7px;width:10px;height:10px;background:var(--ink);border:2px solid var(--white)}

/* scroll area */
.scroll{flex:1;overflow:hidden;position:relative}
.screen.auto .scroll{overflow:visible}
.headblock{padding:var(--s2) var(--margin) var(--s5)}
.body{padding:var(--s5) var(--margin) var(--s6)}
h2{font:700 var(--t-h2)/34px var(--f-serif);letter-spacing:-.005em;text-wrap:balance}
.display{font:700 var(--t-display)/40px var(--f-serif);letter-spacing:-.01em}
.lede{font:400 var(--t-small)/22px var(--f-serif);color:var(--ink-2);margin-top:var(--s2)}
.lede.body16{font-size:var(--t-body);line-height:24px}

/* section header */
.sec{display:flex;align-items:center;justify-content:space-between;min-height:44px;border-bottom:var(--line) solid var(--ink)}
.sec .l{font:700 var(--t-head)/22px var(--f-cond);letter-spacing:.03em}
.link{font:600 var(--t-label)/20px var(--f-cond);letter-spacing:.02em;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:flex;align-items:center}
.textlink{font:400 var(--t-small)/22px var(--f-serif);text-decoration:underline;text-underline-offset:3px;min-height:48px;display:flex;align-items:center}
.textlink.center{justify-content:center}

/* form box */
.field{background:var(--white);border:var(--line) solid var(--ink);border-radius:var(--r);padding:8px 12px 9px;min-height:64px;display:flex;flex-direction:column;justify-content:center;flex:1}
.field .lab{font:600 var(--t-label)/18px var(--f-cond);letter-spacing:.02em;color:var(--ink-2)}
.field .val{font:400 17px/24px var(--f-serif);color:var(--ink);white-space:nowrap}
.field .val.ph{color:var(--ink-3)}
.field.date{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.field.date .col{display:flex;flex-direction:column}
.field.err{border:2px solid var(--stamp);padding:7.5px 11.5px 8.5px}
.field.err .lab{color:var(--stamp)}
.dots{display:flex;gap:5px;align-items:center;height:24px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--ink)}
.row{display:flex;gap:var(--s3)}
.stack>*+*{margin-top:var(--s3)}
.msg-err{display:flex;gap:8px;align-items:flex-start;color:var(--stamp);font:700 var(--t-small)/22px var(--f-serif);margin-top:var(--s2)}
.msg-err .ic{margin-top:1px}
.fine{font:400 var(--t-fine)/20px var(--f-serif);color:var(--ink-2)}

/* buttons */
.footer{flex:none;padding:12px var(--margin);border-top:var(--line) solid var(--ink)}
.btn{height:56px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);font:700 var(--t-button)/24px var(--f-cond);letter-spacing:.03em}
.btn.primary{background:var(--ink);color:var(--canary)}
.btn.secondary{background:transparent;border:var(--line) solid var(--ink);color:var(--ink)}
.btn.disabled{background:var(--dis);border:var(--line) dashed var(--ink-3);color:var(--ink-3)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.chip{height:48px;padding:0 14px;display:flex;align-items:center;gap:8px;background:var(--white);border:var(--line) solid var(--ink);border-radius:var(--r);font:600 17px/20px var(--f-cond);letter-spacing:.02em;color:var(--ink)}
.chip.sel{background:var(--ink);color:var(--white)}
.flabel{font:600 var(--t-label)/18px var(--f-cond);letter-spacing:.02em;color:var(--ink-2)}

/* cards */
.card{background:var(--white);border:var(--line) solid var(--ink);border-radius:var(--r)}
.upload{display:flex;gap:var(--s3);padding:var(--s4);margin-top:var(--s2);background:var(--canary)}
.upload .ok{width:32px;height:32px;background:var(--ink);color:var(--canary);display:flex;align-items:center;justify-content:center;flex:none}
.upload b{font:700 var(--t-body)/22px var(--f-serif);display:block}
.upload span{font:400 var(--t-fine)/20px var(--f-serif);color:var(--ink-2);display:block;margin-top:2px}
.notice{display:flex;gap:var(--s3);padding:var(--s4);background:var(--canary);border:var(--line) solid var(--ink);border-radius:var(--r);font:400 var(--t-small)/22px var(--f-serif)}
.notice .ic{margin-top:2px}
.tagbox{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;font:600 var(--t-label)/18px var(--f-cond);letter-spacing:.02em}
.badge{background:var(--ink);color:var(--white)}
.tag{background:var(--canary);color:var(--ink)}
.avatar{width:48px;height:48px;flex:none;background:var(--pink);border:var(--line) solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 22px/24px var(--f-serif)}
.avatar.lg{width:56px;height:56px;background:var(--canary);font-size:26px}
.deeds{height:48px;padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--canary);font:700 24px/28px var(--f-cond);letter-spacing:.02em;border-radius:var(--r)}

/* list rows */
.navrow{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--rule-soft);font:400 17px/24px var(--f-serif)}
.navrow:last-child{border-bottom:var(--line) solid var(--ink)}
.stats{display:flex}
.stats>div{flex:1;padding:12px 12px 10px;border:var(--line) solid var(--ink);background:var(--white)}
.stats>div+div{margin-left:calc(var(--line) * -1)}
.stats .n{font:700 36px/36px var(--f-cond);letter-spacing:.01em}
.stats .k{font:600 var(--t-label)/20px var(--f-cond);letter-spacing:.02em;color:var(--ink-2)}

/* switch */
.switchrow{display:flex;align-items:center;justify-content:space-between;min-height:56px;font:700 17px/24px var(--f-serif)}
.switch{width:52px;height:32px;border-radius:16px;background:var(--white);border:2px solid var(--ink);position:relative;flex:none}
.switch i{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:10px;background:var(--ink)}

/* ---------- SIGNATURE: the ticket ---------- */
.ticket{position:relative;border:2px solid var(--ink);background:var(--canary)}
.coupon{background:var(--canary);padding:var(--s4)}
.stub{background:var(--white)}
.perf{position:relative;height:0;border-top:2px dashed var(--ink)}
.notch{position:absolute;width:24px;height:24px;border-radius:12px;background:var(--notch,var(--paper))}
.notch.l{left:-13px;top:-13px} .notch.r{right:-13px;top:-13px}
.ticket.side{display:flex}
.ticket.side .coupon{flex:1}
.ticket.side .stub{width:96px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:var(--s4) var(--s2);position:relative}
.perfv{position:relative;width:0;border-left:2px dashed var(--ink)}
.perfv .notch.t{left:-13px;top:-14px} .perfv .notch.b{left:-13px;bottom:-14px}
.tstrip{background:var(--ink);color:var(--canary);font:600 var(--t-label)/20px var(--f-cond);letter-spacing:.03em;padding:6px var(--s4)}
.tlabel{display:flex;align-items:center;justify-content:space-between;font:600 var(--t-label)/20px var(--f-cond);letter-spacing:.02em;color:var(--ink)}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);font:700 20px/20px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px 3px 10px;transform:rotate(-8deg);border-radius:var(--r)}
.stamp.big{font-size:44px;line-height:44px;border-width:3px;padding:8px 18px 6px 22px;transform:rotate(-9deg);position:absolute;left:50%;top:50%;margin:-36px 0 0 -102px;background:transparent}
.t-title{font:700 20px/26px var(--f-serif);margin-top:var(--s2)}
.t-body{font:400 var(--t-small)/22px var(--f-serif);color:var(--ink-2);margin-top:var(--s2)}
.t-name{font:700 var(--t-title)/28px var(--f-serif);margin-top:var(--s2)}
.kv{display:flex;gap:var(--s3);padding:9px 0;border-top:1px solid rgba(38,26,94,.28)}
.kv .k{width:56px;flex:none;font:600 var(--t-label)/22px var(--f-cond);letter-spacing:.02em;color:var(--ink-2)}
.kv .v{font:400 var(--t-small)/22px var(--f-serif);color:var(--ink)}
.deposit{padding:var(--s4)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.drow+.drow{margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--rule-soft)}
.drow .t{font:700 var(--t-body)/22px var(--f-serif)}
.drow.dim .t{font-weight:400;color:var(--ink-2)}
.drow .f{font:700 32px/32px var(--f-cond);letter-spacing:.01em}
.drow.dim .f{font-size:28px;color:var(--ink-2)}
.bullets{list-style:none;margin-top:var(--s3)}
.bullets li{position:relative;padding-left:20px;font:400 var(--t-small)/22px var(--f-serif)}
.bullets li+li{margin-top:var(--s3)}
.bullets li::before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;background:var(--ink)}
.partner{padding:var(--s4)}
.quote{font:400 var(--t-body)/24px var(--f-serif);margin-top:var(--s3)}
.empty-lines{margin-top:var(--s5)}
.empty-lines i{display:block;height:34px;border-bottom:1.5px solid var(--rule-soft)}
</style></head><body>
